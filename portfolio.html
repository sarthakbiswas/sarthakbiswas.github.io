<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio · Sarthak Biswas</title>
<meta name="description" content="Portfolio of Sarthak Biswas.">
<meta name="theme-color" content="#07070a">
<style>
  :root {
    --black: #07070a;
    --ink: #0c0f18;
    --navy: #0e1b36;
    --navy-2: #16294f;
    --gold: #d4af37;
    --gold-soft: #ecd286;
    --gold-line: rgba(212, 175, 55, 0.32);
    --gold-faint: rgba(212, 175, 55, 0.08);
    --text: #eeeae0;
    --muted: #aaa597;
    --serif: "Didot", "Bodoni 72", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --nav-h: 64px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: calc(var(--nav-h) + 16px); -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex; flex-direction: column;
    background-color: var(--black);
    background-image:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(22, 41, 79, 0.85), transparent 70%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(14, 27, 54, 0.7), transparent 70%);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.6;
    overflow-x: hidden;
  }
  main { flex: 1; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(var(--gold-faint) 1px, transparent 1px),
      linear-gradient(90deg, var(--gold-faint) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 20%, #000 20%, transparent 75%);
            mask-image: radial-gradient(ellipse 80% 70% at 50% 20%, #000 20%, transparent 75%);
  }

  a { color: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; border-radius: 4px; }

  .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  .skip {
    position: absolute; left: 16px; top: -60px; z-index: 100;
    background: var(--gold); color: var(--black); padding: 10px 16px; border-radius: 6px;
    font-weight: 600; text-decoration: none;
  }
  .skip:focus { top: 12px; }

  /* ---------- Navigation ---------- */
  .nav {
    position: sticky; top: 0; z-index: 50;
    height: var(--nav-h);
    background: rgba(7, 7, 10, 0.72);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
            backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid var(--gold-line);
  }
  .nav .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .mark {
    display: inline-grid; place-items: center;
    width: 38px; height: 38px;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--serif); font-size: 17px; letter-spacing: 0.06em;
    text-decoration: none;
    transform: rotate(45deg);
    transition: background 0.25s, color 0.25s;
  }
  .mark span { transform: rotate(-45deg); }
  .mark:hover { background: var(--gold); color: var(--black); }
  .nav ul { list-style: none; display: flex; align-items: center; gap: 4px; margin: 0; padding: 0; }
  .nav a.link {
    display: inline-block; padding: 8px 12px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); text-decoration: none;
    transition: color 0.2s;
  }
  .nav a.link:hover { color: var(--gold-soft); }
  .nav a.link[aria-current="page"] { color: var(--gold); }
  .nav .sep { width: 1px; height: 18px; background: var(--gold-line); margin: 0 8px; }

  /* ---------- Page head ---------- */
  .head { padding: clamp(64px, 12vh, 120px) 0 40px; text-align: center; }
  .eyebrow {
    margin: 0;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--gold);
    display: inline-flex; align-items: center; gap: 14px;
  }
  .eyebrow::before, .eyebrow::after { content: ""; width: 40px; height: 1px; background: var(--gold-line); }
  h1 {
    margin: 22px 0 0;
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(46px, 9vw, 96px);
    line-height: 1.02; letter-spacing: 0.02em;
    color: var(--gold);
    background: linear-gradient(100deg, #b8922a 0%, var(--gold-soft) 35%, #fff4cf 50%, var(--gold-soft) 65%, #b8922a 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  @media (prefers-reduced-motion: no-preference) {
    h1 { animation: sheen 9s ease-in-out infinite; }
    @keyframes sheen { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
  }
  .horizon {
    width: min(520px, 80%); height: 1px; margin: 34px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    box-shadow: 0 0 18px rgba(212, 175, 55, 0.55);
  }

  /* ---------- Gallery ---------- */
  .gallery {
    list-style: none; margin: 24px 0 80px; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 18px;
  }
  .work {
    position: relative; display: flex; flex-direction: column; height: 100%;
    min-height: 260px;
    padding: 26px 26px 24px;
    background: linear-gradient(150deg, rgba(22, 41, 79, 0.7), rgba(12, 15, 24, 0.94));
    border: 1px solid rgba(212, 175, 55, 0.22);
    text-decoration: none;
    overflow: hidden;
    transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .work::before, .work::after {
    content: ""; position: absolute; width: 18px; height: 18px; border: 1px solid var(--gold);
  }
  .work::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .work::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  .work:hover { transform: translateY(-4px); border-color: var(--gold); box-shadow: 0 14px 40px -14px rgba(212, 175, 55, 0.5); }

  .work .meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .work .meta b { color: var(--gold); font-weight: 400; }
  .work strong { margin-top: auto; padding-top: 48px; font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.1; color: var(--text); }
  .work .url { margin-top: 8px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
  .work .go {
    margin-top: 20px; align-self: flex-start;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--gold);
    border-bottom: 1px solid var(--gold-line); padding-bottom: 3px;
  }
  .work:hover .go { border-color: var(--gold); }
  @media (prefers-reduced-motion: reduce) { .work, .work:hover { transition: none; transform: none; } }

  /* ---------- Footer ---------- */
  footer { border-top: 1px solid var(--gold-line); padding: 30px 0 40px; }
  footer .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
  footer .name { font-family: var(--serif); font-size: 20px; color: var(--gold); }
  footer nav { display: flex; flex-wrap: wrap; gap: 6px 22px; }
  footer nav a { font-family: var(--mono); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
  footer nav a:hover { color: var(--gold-soft); }

  @media (max-width: 640px) {
    .wrap { padding: 0 16px; }
    .nav .profile, .nav .sep { display: none; }
    .nav a.link { padding: 8px 6px; font-size: 11px; letter-spacing: 0.1em; }
    .work strong { font-size: 32px; }
  }
</style>
</head>
